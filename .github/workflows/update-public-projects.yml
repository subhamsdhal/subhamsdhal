name: Refresh public portfolio projects

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-public-projects.yml"
      - "scripts/update_public_projects.py"

permissions:
  contents: write

concurrency:
  group: profile-public-projects
  cancel-in-progress: false

jobs:
  update-public-projects:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Build index from public GitHub repositories
        run: python3 scripts/update_public_projects.py

      - name: Commit README only if public projects changed
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "No public project changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md
          git commit -m "chore: update public profile project index"
          git push
